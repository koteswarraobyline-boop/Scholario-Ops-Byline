# Scholario Ops — nginx reverse proxy (production)
#
#   sudo cp nginx/scholario-ops.conf /etc/nginx/sites-available/scholario-ops
#   sudo ln -s /etc/nginx/sites-available/scholario-ops /etc/nginx/sites-enabled/
#   Replace ops.example.com with your domain (3 places), then:
#   sudo certbot --nginx -d ops.example.com && sudo nginx -t && sudo systemctl reload nginx
#
# Node (PM2, ecosystem.config.js) listens on 127.0.0.1:4000 and serves both the API and the
# dashboard, and sets Cache-Control / CSP itself. nginx terminates TLS and adds HSTS.
#
# Note: add_header is NOT inherited by a location that has its own add_header. The headers
# below are declared once at server level and no location adds headers, so they apply everywhere.

server {
    listen 80;
    listen [::]:80;
    server_name ops.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.example.com;

    # TLS — certbot fills these in
    ssl_certificate     /etc/letsencrypt/live/ops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Realtime stream (Server-Sent Events): no buffering, long-lived.
    # The session token is in the query string, so this location is never written to the access log.
    location = /api/v1/realtime/stream {
        proxy_pass         http://127.0.0.1:4000;
        proxy_set_header   Connection "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        access_log         off;
    }

    # API — "Probe all" waits for every check, so allow up to 2 minutes
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000;
        access_log off;
    }

    # Dashboard (React build, served by Node with long-lived caching for /assets)
    location / {
        proxy_pass http://127.0.0.1:4000;
    }
}
