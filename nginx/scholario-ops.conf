# Scholario Ops — Nginx Production Configuration
# Place at: /etc/nginx/sites-available/scholario-ops
# Symlink:  ln -s /etc/nginx/sites-available/scholario-ops /etc/nginx/sites-enabled/

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ops.scholario.net;
    return 301 https://$host$request_uri;
}

# HTTPS frontend + API proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ops.scholario.net;

    # ── TLS (replace with real cert paths) ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ops.scholario.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.scholario.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Gzip compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Frontend (React SPA from /dist) ───────────────────────────────────
    root /var/www/scholario-ops/dist;
    index index.html;

    # SPA fallback — all non-API, non-asset routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Backend API proxy ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Do not cache API responses
        add_header Cache-Control "no-store";
    }

    # ── WebSocket proxy ───────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 86400s;  # long timeout for persistent WS
        proxy_send_timeout 86400s;
    }

    # ── Health check ──────────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }
}
